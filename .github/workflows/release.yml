name: release

# Tag a release with a signed tag:  git tag -s v0.1.0 -m "v0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build sdist + wheel reproducibly
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt -r requirements/dev.txt
          python -m build --no-isolation
          python -c "from pathlib import Path; import sys; sys.path.insert(0,'src'); from chunaviq.election.manifest import source_digest; Path('dist/SOURCE_DIGEST').write_text(source_digest()+'\n')"
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Research prototype. Synthetic data only. Verify with SHA256SUMS and the build attestation."
