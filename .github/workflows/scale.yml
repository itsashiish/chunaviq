name: scale

# Manual: 10,000-voter synthetic election + independent verification.
on:
  workflow_dispatch:
    inputs:
      voters:
        description: Eligible voters
        default: "10000"

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - env:
          VOTERS: ${{ inputs.voters }}
        run: |
          chunaviq simulate scale --voters "$VOTERS"
          H=$(python -c "import json;print(json.load(open('scale/summary.json'))['manifest_hash'])")
          chunaviq verify scale/record --expect-manifest-hash "$H" --json scale/verify.json
          chunaviq report scale/verify.json scale/observer-report.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale-evidence
          path: |
            scale/summary.json
            scale/verify.json
            scale/observer-report.html
