name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1" # weekly deep property-based run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes --no-deps -r requirements/dev.txt
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - name: Synthetic-data guard (no Aadhaar/EPIC/mobile-shaped values)
        run: python tools/scan_pii.py

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        backend: ["gmpy2", "pure-python"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt -r requirements/dev.txt
          if [ "${{ matrix.backend }}" = "pure-python" ]; then python -m pip uninstall -y gmpy2; fi
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Group parameters re-derive from public seeds
        run: python tools/gen_group.py --check
      - name: Tests
        env:
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || 'ci' }}
        run: pytest -m "not slow" -q
      - name: End-to-end synthetic election + independent verification
        run: |
          evlab simulate run --voters 300 --constituencies 3 --rsa-bits 3072
          H=$(python -c "import json;print(json.load(open('run/summary.json'))['manifest_hash'])")
          D=$(python -c "from evlab.election.manifest import source_digest;print(source_digest())")
          evlab verify run/record --expect-manifest-hash "$H" --expect-source-digest "$D" --json run/verify.json
          evlab report run/verify.json run/observer-report.html
      - if: matrix.python == '3.13' && matrix.backend == 'gmpy2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-election-evidence
          path: |
            run/summary.json
            run/verify.json
            run/observer-report.html
          retention-days: 30
