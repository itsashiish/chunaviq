name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1" # weekly deep property-based run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes --no-deps -r requirements/dev.txt
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - name: Synthetic-data guard (no Aadhaar/PAN/EPIC/mobile-shaped values)
        run: python tools/scan_pii.py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install (hash-locked Python, lockfile npm)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          npm --prefix web ci
      - name: Python record for the TypeScript verifier
        run: chunaviq simulate pyrec --voters 60 --constituencies 2
      - name: Lint, typecheck, test (includes Python <-> TypeScript cross-verification)
        env:
          PYTHON: python
          PY_RECORD: ${{ github.workspace }}/pyrec/record
        run: |
          npm --prefix web run lint
          npm --prefix web test
      - name: The Python verifier accepts the browser-made record
        run: chunaviq verify web/.record-test --expect-manifest-hash "$(cat web/.record-test/manifest_hash.txt)"
      - run: npm --prefix web run build

  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: National-scale properties (counting at 58 lakh, federation, bounded memory, ingest)
        run: pytest -m scale -q
      - name: Capacity model from measured unit costs
        run: chunaviq capacity > /dev/null && cat docs/scale/capacity.md >> "$GITHUB_STEP_SUMMARY"

  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: HTTP-level DoS defences
        run: pytest tests/test_service.py -q -m "not rehearsal"
      - name: Dress rehearsal over HTTP under attack (smoke profile), end to end
        run: chunaviq rehearse smoke --out rehearsal/smoke && cat rehearsal/smoke/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal-smoke
          path: |
            rehearsal/smoke/*.json
            rehearsal/smoke/*.csv
            rehearsal/smoke/*.md
            rehearsal/smoke/election/record
            rehearsal/smoke/election/hsm
          retention-days: 90

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        backend: ["gmpy2", "pure-python"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt -r requirements/dev.txt
          if [ "${{ matrix.backend }}" = "pure-python" ]; then python -m pip uninstall -y gmpy2; fi
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Group parameters re-derive from public seeds
        run: python tools/gen_group.py --check
      - name: Tests
        env:
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || 'ci' }}
        run: pytest -m "not slow and not scale and not rehearsal" -q
      - name: End-to-end synthetic election + independent verification
        run: |
          chunaviq simulate run --voters 300 --constituencies 3
          H=$(python -c "import json;print(json.load(open('run/summary.json'))['manifest_hash'])")
          D=$(python -c "from chunaviq.election.manifest import source_digest;print(source_digest())")
          chunaviq verify run/record --expect-manifest-hash "$H" --expect-source-digest "$D" --json run/verify.json
          chunaviq report run/verify.json run/observer-report.html
      - if: matrix.python == '3.13' && matrix.backend == 'gmpy2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-election-evidence
          path: |
            run/summary.json
            run/verify.json
            run/observer-report.html
          retention-days: 30
