name: Bug (non-security)
description: Functional bug, docs error or test failure that is NOT exploitable
body:
  - type: markdown
    attributes:
      value: "If this could let someone break eligibility, secrecy or verifiability, stop and use private vulnerability reporting instead."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (synthetic data only)
